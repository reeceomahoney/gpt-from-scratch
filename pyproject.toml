[project]
name = "gpt-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13, <3.14"
dependencies = [
    "datasets>=4.8.5",
    "numpy>=2.4.6",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
    "slurm-tools",
    "tiktoken>=0.13.0",
    "torch>=2.12.0",
    "ty>=0.0.43",
]


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
slurm-tools = { git = "https://github.com/reeceomahoney/slurm-tools.git" }
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
