    host: u6jz.aip2.isambard
    remote_path: /home/u6jz/reece.u6jz/gpt_from_scratch
    time: 24
    gpu: ""
    ngpu: 2
    cpus: 144
    mem: 1600M
    partition: workq

envs:
  - WANDB_API_KEY
  - HF_TOKEN
  - MUJOCO_GL: egl
  - OPENBLAS_NUM_THREADS: 8
  - OMP_NUM_THREADS: 8
